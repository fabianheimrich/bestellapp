<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BurgerHouse</title>

  <link rel="icon" href="images/favicon.png" sizes="any">
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>

<body>
  <!-- HEADER -->
  <header class="topbar">
    <div class="container">
      <div class="topbar__inner">
        <a class="brand" href="#">
          <img src="images/frame.png" alt="Logo" />
        </a>
        <button class="burger" type="button" aria-label="Menü öffnen">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <div class="hero__media" role="img" aria-label="Hero Bild"></div>
    </div>

    <div class="container">
      <div class="hero__card">
        <div class="hero__logo" aria-hidden="true">🍔</div>

        <h1 class="hero__title">
          Burger<span>House</span>
          <span class="hero__rating" aria-label="Bewertung 4.1 von 5">★ 4,1</span>
        </h1>

        <p class="hero__subtitle">
          The best of Burgers, Pizza, and Greens, all in one great place.
        </p>
      </div>
    </div>
  </section>

  <!-- CONTENT -->
  <main class="page">
    <div class="container">
      <div class="layout">
        <!-- Linke Spalte: Menü -->
        <div class="layout__menu" id="menuRoot"></div>

        <!-- Rechte Spalte: Warenkorb -->
        <aside class="layout__basket" aria-label="Warenkorb">
          <div class="basket" id="desktopCart">
            <h3 class="basket__title">Your Basket</h3>

            <div class="basket__items" id="desktopCartItems" role="list"></div>

            <div class="basket__totals">
              <div class="basket__line"><span>Subtotal</span><span id="desktopSubtotal">0,00€</span></div>
              <div class="basket__line"><span>Delivery fee</span><span id="desktopDelivery">4,99€</span></div>
              <div class="basket__divider"></div>
              <div class="basket__line basket__line--total"><span>Total</span><span id="desktopTotal">0,00€</span></div>
            </div>

            <button class="basket__cta" id="desktopOrderBtn" type="button">Buy now (0,00€)</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- MOBILE: Button unten mittig (öffnet Dialog) -->
  <button class="cartFab" id="cartFab" type="button" aria-label="Warenkorb öffnen">
    <span class="cartFab__label">Basket</span>
    <span class="cartFab__total" id="fabTotal">0,00€</span>
  </button>

  <!-- MOBILE: Dialog/Modal Warenkorb -->
  <div class="cartModal" id="cartModal" aria-hidden="true">
    <div class="cartModal__backdrop" data-close="true"></div>

    <div class="cartModal__panel" role="dialog" aria-modal="true" aria-label="Warenkorb Dialog">
      <div class="cartModal__header">
        <h3 class="cartModal__title">Your Basket</h3>
        <button class="iconBtn iconBtn--dark" type="button" data-close="true" aria-label="Schließen">✕</button>
      </div>

      <div class="cartModal__items" id="mobileCartItems" role="list"></div>

      <div class="cartModal__totals">
        <div class="basket__line"><span>Subtotal</span><span id="mobileSubtotal">0,00€</span></div>
        <div class="basket__line"><span>Delivery fee</span><span id="mobileDelivery">4,99€</span></div>
        <div class="basket__divider"></div>
        <div class="basket__line basket__line--total"><span>Total</span><span id="mobileTotal">0,00€</span></div>
      </div>

      <button class="basket__cta" id="mobileOrderBtn" type="button">Buy now (0,00€)</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <span>© 2026 BurgerHouse</span>
        <nav class="footer__links" aria-label="Footer Links">
          <a href="#">Imprint</a>
          <a href="#">Cookie Preferences</a>
        </nav>
      </div>
    </div>
  </footer>
</body>
</html>
